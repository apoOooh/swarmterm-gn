name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check
        type: string
        required: false
        default: ''

# Nothing by default; every job asks for exactly what it needs.
permissions: {}

jobs:
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # Install scripts stay off: only esbuild needs its own (binary check),
      # so it is rebuilt by name. The registry signatures and provenance of
      # every installed package are verified before anything runs.
      - run: npm ci --ignore-scripts && npm rebuild esbuild
      - run: npm audit signatures
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: headless-browser-traces
          path: test-results

  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # bindgen for whisper-rs-sys (SWA-38); LLVM ships with the runner image.
      LIBCLANG_PATH: C:/Program Files/LLVM/bin
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      # Toolchain, components and target come from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts && npm rebuild esbuild && npm run build
        working-directory: .
      - run: cargo fmt --check
      # --locked: build exactly the reviewed Cargo.lock, never a re-resolved one.
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The build without the speech engine (no LLVM) must stay warning-free too.
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked
      - name: Compile desktop application
        run: npx tauri build --no-bundle -- --locked
        shell: bash
        working-directory: .

  supply-chain:
    name: Dependency audit (cargo deny + npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pinned tool version; bump deliberately.
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install cargo-deny
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      # Policy in src-tauri/deny.toml: RustSec advisories, licence allow list
      # (GPL-3.0 compatible), crate sources; duplicate versions only warn,
      # wildcard version requirements are allowed.
      - name: cargo deny
        working-directory: src-tauri
        run: cargo deny check advisories licenses bans sources
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Public history secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  licensing:
    name: REUSE licence compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      # Every file must have a licence and copyright notice (REUSE.toml).
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
