name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # Corp renderer (docs/editions.md); must type-check and bundle too.
      - run: npm run build:corp
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: headless-browser-traces
          path: test-results

  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    env:
      # bindgen for whisper-rs-sys (SWA-38); LLVM ships with the runner image.
      LIBCLANG_PATH: C:/Program Files/LLVM/bin
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
        working-directory: .
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The build without the speech engine (no LLVM) must stay warning-free too.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      # Corp edition (docs/editions.md): its cfg branches compile only with
      # the feature. Linted with speech (the release combination) and
      # without it (the local build), tested without speech to stay quick.
      - run: cargo clippy --all-targets --features corp -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features corp -- -D warnings
      - run: cargo test --no-default-features --features corp --lib
      - run: cargo test
      - name: Compile desktop application
        run: npx tauri build --no-bundle -- --locked
        shell: bash
        working-directory: .

  supply-chain:
    name: Dependency audit (cargo deny + npm audit)
    runs-on: ubuntu-latest
    env:
      # Pinned tool version; bump deliberately.
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install cargo-deny
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      # Policy in src-tauri/deny.toml: RustSec advisories, licence allow list
      # (GPL-3.0 compatible), crate sources; duplicate versions only warn,
      # wildcard version requirements are allowed.
      - name: cargo deny
        working-directory: src-tauri
        run: cargo deny check advisories licenses bans sources
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Public history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
