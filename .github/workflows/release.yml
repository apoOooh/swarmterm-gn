name: Windows release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    if: github.repository == 'apoOooh/swarmterm-gn'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check tag and all version copies
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release/check-version.mjs "$RELEASE_TAG"
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$tag_commit" = "$(git rev-parse HEAD)"
          # Releases are cut from main (docs/release-process.md): the tag must
          # be on main's history, i.e. dev was merged into main first.
          git merge-base --is-ancestor HEAD origin/main
      - name: Require release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: test -s "docs/releases/$RELEASE_VERSION.md"

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.tag }}

  build:
    # Both editions (docs/editions.md) build in parallel on their own runner.
    name: Build Windows installer (${{ matrix.edition }})
    needs: [validate, checks]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - edition: standard
            product: Swarmterm GN
            tauri_args: ''
            cargo_args: ''
          - edition: corp
            product: Swarmterm GN Corp
            tauri_args: --config src-tauri/tauri.corp.conf.json
            cargo_args: --features corp
    env:
      # bindgen for whisper-rs-sys (SWA-38); LLVM ships with the runner image.
      LIBCLANG_PATH: C:/Program Files/LLVM/bin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.edition }}
      - run: npm ci
      - name: Build NSIS installer
        # The corp overlay sets its own identifier, product name and
        # `npm run build:corp` renderer; the Cargo feature adds the locks.
        run: npx tauri build --bundles nsis ${{ matrix.tauri_args }} -- --locked ${{ matrix.cargo_args }}
        shell: bash
      # GN sends no telemetry (decision 2026-10-29); fail the release if an
      # analytics endpoint ever finds its way back into either edition's binary.
      - name: Check exe has no telemetry endpoint
        shell: pwsh
        run: |
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes('src-tauri/target/release/swarmterm.exe'))
          if ($text.Contains('google-analytics')) { throw 'swarmterm.exe contains google-analytics' }
      # Corp compiles the buzzkey installer and the model download out
      # (docs/editions.md); their endpoints in the exe would mean the Rust
      # code leaked back. Scope: the Rust side only. rustc drops consts nobody
      # references, so this also fails if a corp path starts using one. The
      # embedded renderer is compressed and not scanned; its download
      # buttons are hidden, and Rust refuses the commands regardless.
      - name: Check corp exe has no download endpoints
        if: matrix.edition == 'corp'
        shell: pwsh
        run: |
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes('src-tauri/target/release/swarmterm.exe'))
          foreach ($s in 'api.github.com/repos/apoOooh/buzzkey', 'huggingface.co/ggerganov') {
            if ($text.Contains($s)) { throw "corp swarmterm.exe contains $s" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.edition }}
          path: src-tauri/target/release/bundle/nsis/${{ matrix.product }}_${{ needs.validate.outputs.version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Windows release
    needs: [validate, checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-installer-*
          merge-multiple: true
          path: release-assets
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate CycloneDX SBOMs
        env:
          # Pinned tool version; bump deliberately.
          CARGO_CYCLONEDX_VERSION: 0.5.7
        run: |
          cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
          (cd src-tauri && cargo cyclonedx --format json --all-features --target x86_64-pc-windows-msvc)
          # The app crate's SBOM covers its tree; the terminal host is a
          # separate workspace member with its own file.
          mv src-tauri/swarmterm.cdx.json release-assets/sbom-rust.cdx.json
          mv src-tauri/host/swarmterm-host.cdx.json release-assets/sbom-rust-host.cdx.json
          # The SBOMs cover both editions: `--all-features` includes `corp`,
          # which adds no dependencies (docs/editions.md).
          # npm sbom reads the installed tree; scripts are not needed for it.
          npm ci --ignore-scripts
          npm sbom --sbom-format cyclonedx --omit=dev > release-assets/sbom-npm.cdx.json
      - name: Add checksums and publish after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          shopt -s nullglob
          # Standard + Corp (docs/editions.md); both must be there.
          test -e "release-assets/Swarmterm GN_${RELEASE_VERSION}_x64-setup.exe"
          test -e "release-assets/Swarmterm GN Corp_${RELEASE_VERSION}_x64-setup.exe"
          installers=(release-assets/*_"$RELEASE_VERSION"_x64-setup.exe)
          test "${#installers[@]}" -eq 2
          # GitHub replaces spaces in asset names with dots. Hash the final name.
          for installer in "${installers[@]}"; do
            asset="${installer// /.}"
            if [ "$installer" != "$asset" ]; then
              test ! -e "$asset"
              mv -- "$installer" "$asset"
            fi
          done
          (cd release-assets && sha256sum *.exe *.cdx.json > SHA256SUMS.txt)

          state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$state" = false ]; then
            echo '::error::This release is already public; create a new version instead of replacing its assets.'
            exit 1
          fi
          if [ "$state" != true ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Swarmterm GN $RELEASE_VERSION" \
              --notes-file "docs/releases/$RELEASE_VERSION.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

  winget:
    name: Update winget manifest
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Both are opt-in (SWA-43): the first winget submission, the package
      # identifier and the publisher name are the maintainer's decision. Until
      # the WINGET_TOKEN secret (classic PAT, public_repo, with a winget-pkgs
      # fork in the same account) and the WINGET_PACKAGE_ID variable exist,
      # this job does nothing and the release stays green.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      WINGET_PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID }}
      # komac pinned by version AND archive hash, not via a third-party action
      # that could move under a tag.
      KOMAC_VERSION: 2.17.1
      KOMAC_SHA256: e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7
    steps:
      - name: Check winget opt-in
        id: optin
        run: |
          if [ -z "$WINGET_TOKEN" ] || [ -z "$WINGET_PACKAGE_ID" ]; then
            echo "winget update skipped: WINGET_TOKEN secret or WINGET_PACKAGE_ID variable not set."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned komac
        if: steps.optin.outputs.enabled == 'true'
        run: |
          archive="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/${archive}"
          echo "${KOMAC_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/komac"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/komac"
          echo "$RUNNER_TEMP/komac" >> "$GITHUB_PATH"
      - name: Submit winget update
        if: steps.optin.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Same published asset name as scripts/release/winget.mjs.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Swarmterm.GN_${RELEASE_VERSION}_x64-setup.exe"
          komac update "$WINGET_PACKAGE_ID" --version "$RELEASE_VERSION" --urls "$url" --submit
