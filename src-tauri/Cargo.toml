[package]
name = "swarmterm"
version = "1.13.0"
description = "One window for a whole swarm of AI coding agents — split terminals, per-agent git worktrees, live web previews, and a War Room where agents collaborate"
authors = ["Duong Duc Nguyen"]
license = "GPL-3.0-only"
homepage = "https://github.com/apoOooh/swarmterm-gn"
repository = "https://github.com/apoOooh/swarmterm-gn"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swarmterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: the three settings writers (mcp/config.rs,
# statusline/install.rs, hook/install.rs) rebuild USER-owned JSON files
# through `Value`; the default BTreeMap alphabetises every key on the
# first write. indexmap is already in the graph, so this adds no crate.
# Trap: with this feature `Map::remove` is swap_remove — use shift_remove.
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
percent-encoding = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
rmcp = { version = "2.1", features = ["server", "transport-streamable-http-server"] }
# Both already in the tree via tauri-plugin-updater — direct deps for analytics.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
# `sync` is already pulled in transitively (axum/rmcp), but `peer_wake` (a
# `tokio::sync::Notify` on AppState) is ours, so name the feature here rather
# than ride feature unification that a dependency bump could silently drop.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "sync", "time"] }
toml_edit = "0.22"
notify = "8.2"
clipboard-rs = { version = "0.3.5", default-features = false, features = ["image"] }
dunce = "1"
sha2 = "0.10"
tempfile = "3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects so killing a terminal tears down the shell's whole process tree
# (children/grandchildren) instead of just the shell itself.
windows-sys = { version = "0.59", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }
