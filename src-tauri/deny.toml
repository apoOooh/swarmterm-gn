# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
# Run from src-tauri/: `cargo deny check`. CI runs it on every push and PR.
# Swarmterm GN is GPL-3.0-only, so every dependency licence below must be
# compatible with distribution under GPL-3.0.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# RustSec advisory database. Vulnerabilities always fail; unmaintained or
# yanked crates fail too unless listed in `ignore` with a reason.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "GPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
