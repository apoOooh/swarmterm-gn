# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
# Run from src-tauri/: `cargo deny check`. CI runs it on every push and PR.
# Swarmterm GN is GPL-3.0-only, so every dependency licence below must be
# compatible with distribution under GPL-3.0.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# RustSec advisory database. Vulnerabilities, unsound and unmaintained
# crates (anywhere in the tree) and yanked versions fail unless listed in
# `ignore` with a written reason.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
    # Unmaintained, no vulnerability. The unic-* crates are pulled only by
    # urlpattern 0.3 <- tauri-utils 2.9 (tauri, tauri-build); no urlpattern
    # release without them is reachable from tauri 2.11. They do Unicode
    # identifier tables for URL patterns, compiled in, no untrusted input
    # from us. Revisit when tauri-utils moves off urlpattern 0.3.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range: unmaintained, via urlpattern <- tauri-utils; no fixed tauri release yet" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common: unmaintained, via urlpattern <- tauri-utils; no fixed tauri release yet" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property: unmaintained, via urlpattern <- tauri-utils; no fixed tauri release yet" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: unmaintained, via urlpattern <- tauri-utils; no fixed tauri release yet" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: unmaintained, via urlpattern <- tauri-utils; no fixed tauri release yet" },
    # Unmaintained, no vulnerability. serial 0.4 is an unconditional
    # dependency of portable-pty 0.8 (our direct dep, in swarmterm and
    # swarmterm-host); we never open serial ports, only ConPTY. Fixed by the
    # portable-pty 0.9 upgrade, which is an API change tracked separately.
    { id = "RUSTSEC-2017-0008", reason = "serial: unmaintained, via portable-pty 0.8; serial ports unused; revisit with portable-pty 0.9 upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "GPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
